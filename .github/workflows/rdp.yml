name: Windows RDP (Localtonet 100% Working)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Setup & Start Localtonet RDP
      run: |
        Invoke-WebRequest -Uri "https://localtonet.com/download/localtonet-win-x64.zip" -OutFile "localtonet.zip"
        Expand-Archive -Path "localtonet.zip" -DestinationPath "."
        ./localtonet.exe authtoken ${{ secrets.LOCALTONET_TOKEN }}
        
        # Create TCP Tunnel for Port 3389
        Start-Process -FilePath ".\localtonet.exe" -ArgumentList "tcp 3389" -RedirectStandardOutput "tunnel.log"
        Start-Sleep -Seconds 10

        Write-Host "=========================================="
        Write-Host "🚀 RDP DETAILS READY FOR MSTSC"
        Write-Host "=========================================="
        Get-Content tunnel.log | Select-String -Pattern "localtonet.com:"
        Write-Host "USERNAME     : runneradmin"
        Write-Host "PASSWORD     : Pass123456!@#"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
