name: Windows RDP (Pinggy Tunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Start Pinggy & Show RDP Address
      run: |
        Start-Process -FilePath "ssh" -ArgumentList "-p 443 -R0:localhost:3389 tcp@a.pinggy.io -o StrictHostKeyChecking=no" -RedirectStandardOutput "pinggy.log"
        Start-Sleep -Seconds 12
        Write-Host "=========================================="
        Write-Host "🚀 PINGGY OUTPUT LOGS"
        Write-Host "=========================================="
        Get-Content pinggy.log
        Write-Host "=========================================="
        Write-Host "USERNAME     : runneradmin"
        Write-Host "PASSWORD     : Pass123456!@#"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
