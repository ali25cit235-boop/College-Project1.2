name: Windows RDP (100% Working Pinggy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Start Pinggy RDP Tunnel
      run: |
        $sshProcess = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -PassThru
        Start-Sleep -Seconds 12
        
        Write-Host "=========================================="
        Write-Host "🚀 RDP CONNECTION DETAILS"
        Write-Host "=========================================="
        $log = Get-Content pinggy.log
        $log | Select-String -Pattern "tcp://"
        Write-Host "USERNAME     : runneradmin"
        Write-Host "PASSWORD     : Pass123456!@#"
        Write-Host "=========================================="
        
        Start-Sleep -Seconds 21600
