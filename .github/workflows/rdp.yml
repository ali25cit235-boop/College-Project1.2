name: Windows RDP (Pyngrok Direct)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Setup Pyngrok & Start RDP Tunnel
      run: |
        pip install pyngrok
        python -c "
        from pyngrok import ngrok
        import os

        authtoken = '${{ secrets.NGROK_AUTH_TOKEN }}'
        ngrok.set_auth_token(authtoken)

        tunnel = ngrok.connect(3389, 'tcp')
        clean_url = tunnel.public_url.replace('tcp://', '')

        print('\n' + '='*45)
        print('🚀 WINDOWS RDP DETAILS READY!')
        print('='*45)
        print(f'🌐 IP / ADDRESS : {clean_url}')
        print('👤 USERNAME     : runneradmin')
        print('🔑 PASSWORD     : Pass123456!@#')
        print('='*45 + '\n')
        "

    - name: Keep RDP Alive
      run: |
        Start-Sleep -Seconds 21600
