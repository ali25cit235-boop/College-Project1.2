name: Windows RDP (Auto Fetch Credentials)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

    - name: Set RDP User Password
      run: |
        cmd /c "net user runneradmin Pass123456!@#"

    - name: Install & Configure Ngrok
      run: |
        choco install ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Start Ngrok Tunnel
      run: |
        Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"

    - name: Fetch and Display RDP Credentials
      run: |
        Start-Sleep -Seconds 5
        $tunnel = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $address = $tunnel.tunnels[0].public_url.Replace("tcp://", "")
        Write-Output "=========================================="
        Write-Output "IP / ADDRESS : $address"
        Write-Output "USERNAME     : runneradmin"
        Write-Output "PASSWORD     : Pass123456!@#"
        Write-Output "=========================================="

    - name: Keep RDP Alive
      run: |
        Start-Sleep -Seconds 21600
